# Supabase-Projektkonfiguration für JOPML. Anwenden:  supabase link --project-ref <REF>  &&  supabase config push
# Das Google-Client-Secret NICHT hier eintragen, sondern als Umgebungsvariable setzen:
#   export SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET=...   (Google Cloud Console -> Client vom Typ "Webanwendung")
project_id = "jopml"

[auth]
enabled = true
site_url = "http://127.0.0.1:53682/callback"
additional_redirect_urls = ["http://127.0.0.1:53682/callback"]   # Loopback des Launchers (OAUTH_LOOPBACK_PORT)
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false        # MUSS aus sein: Konten haben eine Pseudo-E-Mail (jrnwle+<name>@gmail.com)
secure_password_change = false

[auth.rate_limit]
sign_in_sign_ups = 30               # Anmeldungen/Registrierungen pro 5 Minuten und IP
token_refresh = 150

[auth.external.google]
enabled = true
client_id = "1074605193535-edplvmfud08vo1lebb2vb82s64r9m4aq.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[functions.jopml-ai]
verify_jwt = true
