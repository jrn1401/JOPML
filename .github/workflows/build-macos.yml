name: Build macOS DMG

# Baut JOPML.dmg auf einem macOS-Runner (Apple Silicon). Läuft bei Änderung dieser Datei oder manuell.
# Ergebnis: Artifact "JOPML-macos" (Actions-Lauf) und, falls das Release v<APP_VERSION> existiert, als Release-Datei.
# Die App ist nicht von Apple signiert/notarisiert (ad-hoc signiert): beim ersten Start Rechtsklick -> Öffnen.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build-macos.yml", "core/version.py"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Pakete
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tk prüfen
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Icon (.icns)
        run: |
          python tools/make_icon.py
          python -c "from PIL import Image; Image.open('build/icon.png').convert('RGBA').resize((1024,1024)).save('build/icon.icns')"
      - name: App bauen
        run: >
          pyinstaller --noconfirm --clean --windowed --name JOPML --icon build/icon.icns
          --osx-bundle-identifier de.jopml.launcher
          --collect-all customtkinter --collect-submodules pynput $(python tools/pyi_args.py) main.py
      - name: Selbsttest der gebauten App (lädt alle Module)
        run: |
          dist/JOPML.app/Contents/MacOS/JOPML --selftest "$PWD/selftest.txt" || true
          if [ -s selftest.txt ]; then
            R=$(head -c 3000 selftest.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          else
            R="selftest.txt wurde nicht erzeugt"
          fi
          if ! grep -q '^FAIL' selftest.txt 2>/dev/null && [ -s selftest.txt ]; then echo "::notice title=Selftest ok::$R"; else echo "::error title=Selftest::$R"; exit 1; fi
      - name: Ad-hoc signieren und DMG erzeugen
        run: |
          codesign --force --deep -s - dist/JOPML.app
          mkdir -p dmgroot && cp -R dist/JOPML.app dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "JOPML" -srcfolder dmgroot -ov -format UDZO JOPML.dmg
          ls -la JOPML.dmg
      - uses: actions/upload-artifact@v4
        with: { name: JOPML-macos, path: JOPML.dmg }
      - name: An Release anhängen und version.json um macOS ergänzen
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(python -c 'from core.version import APP_VERSION; print(APP_VERSION)')
          # Auf das Windows-Release warten (bis zu 30 Minuten), damit version.json existiert.
          for i in $(seq 1 90); do
            gh release view "v$V" >/dev/null 2>&1 && gh release view "v$V" --json assets --jq '.assets[].name' | grep -q '^version.json$' && break
            sleep 20
          done
          if ! gh release view "v$V" >/dev/null 2>&1; then echo "Release v$V nicht gefunden – DMG nur als Artifact."; exit 0; fi
          gh release upload "v$V" JOPML.dmg --clobber
          SHA=$(shasum -a 256 JOPML.dmg | cut -d' ' -f1)
          gh release download "v$V" -p version.json -O version.json --clobber
          python - "$SHA" "$GITHUB_REPOSITORY" <<'PY'
          import json, sys
          sha, repo = sys.argv[1], sys.argv[2]
          d = json.load(open("version.json", encoding="utf-8"))
          d.setdefault("packages", {})["macos"] = {"url": f"https://github.com/{repo}/releases/latest/download/JOPML.dmg", "sha256": sha}
          json.dump(d, open("version.json", "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          PY
          gh release upload "v$V" version.json --clobber
